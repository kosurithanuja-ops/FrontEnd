<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Courses Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h2>Student Details</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Courses</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>

                <td>85</td>
            </tr>

            <tr>
                <td>102</td>

                <td>Python</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>David</td>
                <td>HTML</td>
                <td>88</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Emma</td>
                <td>CSS</td>
                <td>92</td>
            </tr>

            <tr>
                <td>105</td>
                <td>Alex</td>
                <td>JavaScript</td>
                <td>87</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
