<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration</h1>

    <form>

        <label>Name:</label>
        <input
            type="text"
            name="name"
            required
            minlength="3"
            maxlength="30"
            pattern="[A-Za-z ]+"
            title="Name should contain only letters and spaces">
        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            required>
        <br><br>

        <label>Phone:</label>
        <input
            type="tel"
            name="phone"
            required
            pattern="[0-9]{10}"
            minlength="10"
            maxlength="10"
            title="Phone number must contain exactly 10 digits">
        <br><br>

        <label>Age:</label>
        <input
            type="number"
            name="age"
            min="18"
            max="60"
            required>
        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
            required
            minlength="8"
            maxlength="20"
            title="Password must contain at least 8 characters">
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
